apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-booking
  labels:
    app: hotel-booking
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hotel-booking
  template:
    metadata:
      labels:
        app: hotel-booking
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: hotel-booking
          image: hotel-booking-system:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: BOOKINGS_FILE
              value: /data/bookings.tsv
          volumeMounts:
            - name: booking-data
              mountPath: /data
            - name: temporary-files
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: booking-data
          persistentVolumeClaim:
            claimName: hotel-booking-data
        - name: temporary-files
          emptyDir: {}
